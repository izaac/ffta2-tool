# Final Fantasy Tactics A2 (FFTA2) Save Tool - Configuration Template
# Copy this file to config.toml or ~/.config/ffta2-tool/config.toml

[paths]
# Directory where automatic timestamped backups are stored.
# Tilde (~) is automatically expanded to the user's home directory.
backup_dir = "~/Documents/FFTA2_Backups"

# Optional: Default save file to target (skips auto-detection if specified).
# Overridden if a save file path is passed directly on the command line.
# save_file = "~/Documents/FFTA2_Backups/071 Final Fantasy Tactics A2.sav"

# Optional: Default NDS ROM file for ROM inspection and headless melonDS tests.
# rom_file = "~/ROMs/NDS/Final Fantasy Tactics A2 (USA).nds"

# List of glob patterns / paths searched during save auto-detection.
search_paths = [
    "/run/media/*/*/Saves/nds/*Final Fantasy Tactics A2*.sav",
    "/media/*/*/Saves/nds/*Final Fantasy Tactics A2*.sav",
    "~/Documents/FFTA2_Backups/*.sav",
    "examples/*.sav",
    "*.sav",
]

[defaults]
# Default target save slot: 1 or 2 (default: 1)
slot = 1

# Clan inventory equipment injection quantity per item (default: 50)
equip_qty = 50

# Automatic snapshot backup before modifications (default: true)
backup = true
